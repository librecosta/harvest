# Copy to config.yaml, replace placeholders and protect the file.
http:
  listen: "127.0.0.1:8080"

database:
  host: "127.0.0.1"
  port: 5432
  name: "harvest"
  user: "harvest"
  password: "REPLACE_WITH_THE_HARVEST_DATABASE_PASSWORD"
  tls_mode: "verify-full"
  max_connections: 4

steam_evidence:
  max_versions_per_scope: 5
  history_days: 90
  namespace_budget_bytes: 268435456
  global_budget_bytes: 1073741824
  prune_batch_size: 32

# Allow explicit steam.details Output Schema 2 only in dedicated pilot namespaces.
steam_media_preview_namespaces: []
# Allow explicit steam.details Output Schema 3 only in dedicated pilot namespaces.
steam_rich_details_preview_namespaces: []
steam_events_preview_namespaces: []
# Allow StoreBrowse jobs only in dedicated pilot namespaces.
steam_assets_preview_namespaces: []

# Generate distinct URL-safe tokens. Give the Worker only its own token.
principals:
  - name: "harvest_operator"
    role: "operator"
    token: "REPLACE_WITH_A_RANDOM_OPERATOR_TOKEN"
    namespaces: ["public"]
  - name: "harvest_consumer"
    role: "reader"
    token: "REPLACE_WITH_A_RANDOM_CONSUMER_TOKEN"
    namespaces: ["public"]
  - name: "harvest_worker"
    role: "worker"
    token: "REPLACE_WITH_A_RANDOM_WORKER_SERVICE_TOKEN"
    namespaces: ["public"]
    capabilities: [web.http, web.dns, web.tls, web.robots, web.sitemap, web.assets, web.rdap, steam.details, steam.news, steam.players]
    egress_profiles: ["local"]
    max_slots: 2
