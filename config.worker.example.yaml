# Copy to config.worker.yaml and set its filesystem permissions.
# Match the offer and egress profile to the server's Worker grant and policy.
control_url: "http://127.0.0.1:8080"
token: "REPLACE_WITH_THE_WORKER_SERVICE_TOKEN"
concurrency: 2

offers:
  - capability: "web.http"
    request_schema: 1
    output_schema: 1
    implementation: "web_v1"

egress:
  profiles:
    - name: "regional"
      mode: "require_proxy"
      endpoints: ["exit_cn"]
  endpoints:
    - id: "exit_cn"
      url: "https://proxy.example.invalid:8443"
      enabled: true
      region: "cn"
      concurrency: 2
      health_target: "proxy.example.invalid:8443"
      cooldown_seconds: 30
      bytes_per_minute: 4194304
