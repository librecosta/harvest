services:
  harvest:
    image: "${HARVEST_IMAGE:-harvest:local}"
    ports:
      - "127.0.0.1:${HARVEST_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: "${HARVEST_CONFIG:-./config.yaml}"
        target: /etc/harvest/config.yaml
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    profiles: [worker]
    image: "${HARVEST_IMAGE:-harvest:local}"
    command: ["worker", "--config", "/etc/harvest/worker.yaml"]
    volumes:
      - type: bind
        source: "${HARVEST_WORKER_CONFIG:-./config.worker.yaml}"
        target: /etc/harvest/worker.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/harvest", "healthcheck", "--worker", "--config", "/etc/harvest/worker.yaml"]
      timeout: 5s
    read_only: true
    stop_grace_period: 10s
