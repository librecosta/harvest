version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: queries
        out: internal/database/queries
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: {import: uuid, type: UUID, pointer: true}
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
