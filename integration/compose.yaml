services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: harvest_a0_test
      POSTGRES_USER: harvest_test
      POSTGRES_PASSWORD: harvest_test_disposable
    ports:
      - "127.0.0.1:${HARVEST_TEST_DB_PORT:-0}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "harvest_test", "-d", "harvest_a0_test"]
      interval: 1s
      timeout: 3s
      retries: 30
